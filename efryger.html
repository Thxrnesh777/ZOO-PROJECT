<!DOCTYPE html>
<html>
<head>
<title>Luxury Zoo Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    overflow:hidden;
}

/* Animated background circles */
body::before, body::after{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:linear-gradient(45deg,#00ffcc,#00ff88);
    animation: move 10s infinite alternate;
    filter: blur(150px);
}

body::after{
    background:linear-gradient(45deg,#ff00cc,#ff0066);
    top:60%;
    left:60%;
}

@keyframes move{
    0%{ transform:translate(-100px,-100px);}
    100%{ transform:translate(100px,100px);}
}

.container{
    position:relative;
    width:380px;
    padding:40px;
    background: rgba(255,255,255,0.08);
    border-radius:20px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 40px rgba(0,255,200,0.5);
    animation: fadeIn 1.5s ease-in-out;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(50px);}
    to{opacity:1; transform:translateY(0);}
}

h2{
    text-align:center;
    color:white;
    margin-bottom:25px;
    letter-spacing:2px;
}

.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:12px;
    background:transparent;
    border:none;
    border-bottom:2px solid #00ffcc;
    color:white;
    font-size:16px;
    outline:none;
}

.input-box input:focus{
    border-bottom:2px solid #ff00cc;
    transition:0.3s;
}

button{
    width:100%;
    padding:12px;
    background:linear-gradient(45deg,#00ffcc,#00ff88);
    border:none;
    border-radius:30px;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.4s;
}

button:hover{
    transform:scale(1.1);
    box-shadow:0 0 20px #00ffcc;
}

.link{
    text-align:center;
    margin-top:20px;
    color:white;
}

.link a{
    color:#00ffcc;
    text-decoration:none;
}

.link a:hover{
    text-shadow:0 0 10px #00ffcc;
}
</style>
</head>

<body>

<div class="container">
    <h2>🦁 ZOO REGISTER</h2>

    <form action="login.html">
        <div class="input-box">
            <input type="text" placeholder="Full Name" required>
        </div>

        <div class="input-box">
            <input type="email" placeholder="Email" required>
        </div>

        <div class="input-box">
            <input type="password" placeholder="Password" required>
        </div>

        <div class="input-box">
            <input type="password" placeholder="Confirm Password" required>
        </div>

        <button type="submit">Create Account</button>
    </form>

    <div class="link">
        Already Member? <a href="login.html">Login Now</a>
    </div>
</div>

</body>
</html>
