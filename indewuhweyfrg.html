<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>8D Zoo Cards</title>

<style>
body{
    background:#0f0f0f;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Poppins,sans-serif;
}

.scene{
    width:300px;
    height:400px;
    perspective:2000px;
}

.card{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.2s ease;
    border-radius:25px;
}

/* Floating Animation */
@keyframes float{
    0%{ transform:translateY(0px);}
    50%{ transform:translateY(-10px);}
    100%{ transform:translateY(0px);}
}

.card{
    animation:float 4s ease-in-out infinite;
}

/* Front */
.card img{
    width:100%;
    height:100%;
    border-radius:25px;
    object-fit:cover;
    position:absolute;
    backface-visibility:hidden;
}

/* Back */
.card .back{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:25px;
    background:linear-gradient(45deg,#00ffcc,#ff00cc);
    color:black;
    font-size:22px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
    transform:rotateY(180deg);
    backface-visibility:hidden;
}

/* Glow Layer */
.scene::before{
    content:"";
    position:absolute;
    width:300px;
    height:400px;
    border-radius:25px;
    background:linear-gradient(45deg,#00ffcc,#ff00cc);
    filter:blur(40px);
    z-index:-1;
    opacity:0.7;
}

</style>
</head>
<body>

<div class="scene">
    <div class="card" id="card">
        <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d">
        <div class="back">Lion - King of Jungle</div>
    </div>
</div>

<script>

const card = document.getElementById("card");

document.querySelector(".scene").addEventListener("mousemove", function(e){

    let x = e.offsetX;
    let y = e.offsetY;
    let width = this.offsetWidth;
    let height = this.offsetHeight;

    let rotateY = ((x / width) - 0.5) * 40;
    let rotateX = ((y / height) - 0.5) * -40;

    card.style.transform =
        `rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;
});

/* Reset position */
document.querySelector(".scene").addEventListener("mouseleave", function(){
    card.style.transform = "rotateY(0deg) rotateX(0deg)";
});

/* Click flip */
card.addEventListener("click", function(){
    if(card.style.transform.includes("180deg")){
        card.style.transform = "rotateY(0deg)";
    } else {
        card.style.transform = "rotateY(180deg)";
    }
});

</script>

</body>
</html>
